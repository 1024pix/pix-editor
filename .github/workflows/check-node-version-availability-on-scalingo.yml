name: Check node version availability on Scalingo

on:
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:
        types: [checks_requested]

jobs:
    check-node-compatibility:
        if: github.head_ref == 'renovate/node' || startsWith(github.head_ref, 'renovate/node-') || (startsWith(github.head_ref, 'renovate/major-') && endsWith(github.head_ref, '-node'))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: 1024pix/pix-actions/check-node-version-availability-on-scalingo@ec3f5d938205a43545f482dcd3212193c036ec28 # v0.23.9
